# Serve service worker EXACTLY as file

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# Serve manifest EXACTLY as file

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

# Serve icons EXACTLY as files

[[redirects]]
  from = "/icon-192.png"
  to = "/icon-192.png"
  status = 200

[[redirects]]
  from = "/icon-512.png"
  to = "/icon-512.png"
  status = 200

# Fallback for SPA routing

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
