<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reborro – Remember who borrowed what</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SEO -->
    <meta name="description" content="Reborro is the simplest way to track borrowed money and items. No account needed. Fast and private." />
  </head>

  <body class="bg-zinc-950 text-white">

    <!-- HERO SECTION -->
    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6">
      
      <!-- Logo -->
      <img src="./icon-512.png" alt="Reborro Logo" class="w-24 h-24 mb-6 opacity-90" />

      <h1 class="text-5xl font-bold mb-4">Reborro</h1>

      <p class="text-zinc-400 text-lg max-w-sm mb-10 leading-relaxed">
        Track borrowed money and items.  
        Simple for everyone.
      </p>

      <a
        href="https://app.reborro.com"
        class="bg-white text-black px-10 py-4 rounded-full font-semibold text-lg shadow-lg hover:scale-105 active:scale-95 transition"
      >
        Open the App
      </a>

      <p class="text-zinc-500 text-xs mt-3">
        Works on all phones • No account needed
      </p>

    </section>

    <!-- FEATURES -->
    <section class="py-20 px-6">
      <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-center">

        <div class="space-y-3">
          <div class="text-3xl">➕</div>
          <h3 class="font-semibold text-lg">Add item</h3>
          <p class="text-zinc-500 text-sm">Who borrowed it?</p>
        </div>

        <div class="space-y-3">
          <div class="text-3xl">💬</div>
          <h3 class="font-semibold text-lg">Send reminder</h3>
          <p class="text-zinc-500 text-sm">WhatsApp in one tap.</p>
        </div>

        <div class="space-y-3">
          <div class="text-3xl">⏳</div>
          <h3 class="font-semibold text-lg">Due dates</h3>
          <p class="text-zinc-500 text-sm">Never forget again.</p>
        </div>

      </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-12 text-center border-t border-white/5 text-zinc-500 text-sm">
      © 2025 Reborro — A simple tool for everyone.
    </footer>

  </body>
</html>
